name: Release

# A tag `v*` builds every platform and drafts a GitHub release with the updater's `latest.json`.
# A manual run builds the chosen platforms and keeps the installers as workflow artifacts.
#
# Signed updates need two repository settings, which only the owner can add:
#   secrets.TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD) — from `npx tauri signer generate`
#   vars.SNIPPET_DESK_UPDATER_PUBKEY — the matching public key, built into the app
# Without them the build still succeeds, unsigned, and the app says it cannot update itself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        type: choice
        default: linux
        options: [linux, all]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Skip platforms not asked for
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.platforms }}" = "linux" ] && [ "${{ matrix.name }}" != "linux" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - name: System libraries Tauri links against
        if: steps.gate.outputs.run == 'true' && matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.run == 'true'
        with:
          workspaces: src-tauri
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - name: Sign updates only when the key is configured
        id: signing
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'args=--config {"bundle":{"createUpdaterArtifacts":true}}' >> "$GITHUB_OUTPUT"
            echo "Updater artifacts will be signed."
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice::No TAURI_SIGNING_PRIVATE_KEY secret: building unsigned; the app will report that it cannot update itself."
          fi
      - uses: tauri-apps/tauri-action@v0
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SNIPPET_DESK_UPDATER_PUBKEY: ${{ vars.SNIPPET_DESK_UPDATER_PUBKEY }}
        with:
          args: ${{ steps.signing.outputs.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Snippet Desk ${{ github.ref_name }}"
          releaseDraft: true
          includeUpdaterJson: true
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true' && github.event_name == 'workflow_dispatch'
        with:
          name: snippet-desk-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 14
